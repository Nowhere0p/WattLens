spring.application.name=ingestion-service
# server
server.port=8082

# kafka
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.template.default-topic=energy-usage
# producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nowhere.ingestion_service.kafka.event
spring.kafka.consumer.properties.spring.json.value-default-type=com.nowhere.ingestion_service.kafka.event.EnergyUsageEvent

# simulation
simulation.endpoint=http://localhost:8082/api/v1/ingestion
simulation.requests-per-interval=1000
simulation.interval-ms=5000
simulation.parallel-threads=10
# only one simulator should be active at a time
simulation.continuous-enabled=false
simulation.parallel-enabled=true

# Actuator Config
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
